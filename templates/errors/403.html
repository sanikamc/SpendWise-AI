{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}
{% block topbar_title %}Access Denied{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--danger); line-height: 1; margin-bottom: 0.5rem;">403</div>
    <h3 style="font-size: 1.35rem; color: var(--text-main); margin-bottom: 0.75rem;">Access Forbidden</h3>
    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.75rem; line-height: 1.5;">
      You do not have authorization to view, edit, or delete another user's financial records.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="display: inline-flex;">&larr; Return to Your Dashboard</a>
  </div>
</div>
{% endblock %}
