{% extends "base.html" %}

{% block title %}Sign In{% endblock %}
{% block topbar_title %}Account Authentication{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); overflow: hidden;">
    <div class="card-header" style="background: var(--hero-gradient); color: white; padding: 1.75rem 1.5rem; text-align: center; display: block; border-bottom: none;">
      <div style="width: 48px; height: 48px; background: rgba(255, 255, 255, 0.15); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">₹</div>
      <h3 style="font-size: 1.35rem; font-weight: 700; color: #ffffff;">Sign In to SpendWise</h3>
      <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.35rem;">Enter your credentials to access your financial dashboard</p>
    </div>

    <div class="card-body" style="padding: 1.75rem;">
      <form action="{{ url_for('login', next=request.args.get('next', '')) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="identity">Username or Email *</label>
          <input type="text" id="identity" name="identity" class="form-control" placeholder="e.g. alex or alex@example.com" value="{{ form_data.get('identity', '') if form_data else '' }}" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; font-weight: 600;">
          Sign In &rarr;
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: #64748b;">
        Don't have an account?
        <a href="{{ url_for('register') }}" style="color: var(--primary-purple); font-weight: 600; text-decoration: none;">Create one here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
